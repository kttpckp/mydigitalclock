trigger: none
pr: none

pool:
  name: DigitalClockPool
  demands:
    - Agent.Name -equals digitalclock-windows

steps:
- checkout: none

- powershell: |
    $ErrorActionPreference = "Stop"
    [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)

    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"

    if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
      throw "Docker Hub token is missing."
    }

    $token = $env:DOCKERHUB_TOKEN.Trim()
    if ($token.StartsWith('$(')) {
      throw "Azure DevOps did not resolve the secret variable."
    }

    $remoteCommand = 'set -eu; umask 077; auth_dir=$(mktemp -d); trap ''rm -f $auth_dir/config.json; rmdir $auth_dir'' EXIT; docker --config $auth_dir login --username hazrulfitri --password-stdin'

    $start = New-Object System.Diagnostics.ProcessStartInfo
    $start.FileName = (Get-Command ssh.exe -CommandType Application | Select-Object -First 1).Source
    $start.UseShellExecute = $false
    $start.RedirectStandardInput = $true
    $start.Arguments = '-i "{0}" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 "{1}"' -f $keyPath, $remoteCommand

    $process = New-Object System.Diagnostics.Process
    $process.StartInfo = $start

    try {
      [void]$process.Start()

      $bytes = [Text.Encoding]::UTF8.GetBytes($token)
      $stream = $process.StandardInput.BaseStream
      $stream.Write($bytes, 0, $bytes.Length)
      $stream.Flush()
      $stream.Close()

      $process.WaitForExit()

      if ($process.ExitCode -ne 0) {
        throw "Docker Hub login failed."
      }

      Write-Host "PASS: Docker Hub login succeeded through Azure."
    }
    finally {
      $process.Dispose()
    }
  displayName: 'Verify Docker Hub login'
  env:
    DOCKERHUB_TOKEN: $(DOCKERHUB_TOKEN_TEST)