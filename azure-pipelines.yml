trigger: none
pr: none

pool:
  name: DigitalClockPool
  demands:
    - Agent.Name -equals digitalclock-windows

steps:
- checkout: none

- powershell: |
    $ErrorActionPreference = "Stop"
    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"
    $testText = "digitalclock-transfer-test-123"
    $bytes = [Text.Encoding]::UTF8.GetBytes($testText)

    $sha = [Security.Cryptography.SHA256]::Create()
    try {
      $expected = [BitConverter]::ToString(
        $sha.ComputeHash($bytes)
      ).Replace("-", "").ToLowerInvariant()
    }
    finally {
      $sha.Dispose()
    }

    $start = New-Object System.Diagnostics.ProcessStartInfo
    $start.FileName = (Get-Command ssh.exe -CommandType Application | Select-Object -First 1).Source
    $start.UseShellExecute = $false
    $start.RedirectStandardInput = $true
    $start.RedirectStandardOutput = $true
    $start.Arguments = '-i "{0}" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 sha256sum' -f $keyPath

    Write-Host "SSH executable: $($start.FileName)"

    $process = New-Object System.Diagnostics.Process
    $process.StartInfo = $start

    try {
      [void]$process.Start()

      $stream = $process.StandardInput.BaseStream
      $stream.Write($bytes, 0, $bytes.Length)
      $stream.Flush()
      $stream.Close()

      $output = $process.StandardOutput.ReadToEnd()
      $process.WaitForExit()

      if ($process.ExitCode -ne 0) {
        throw "SSH diagnostic failed."
      }

      $received = ($output.Trim() -split '\s+')[0]

      Write-Host "Expected fingerprint: $expected"
      Write-Host "Received fingerprint: $received"

      if ($received -ne $expected) {
        throw "FAIL: Received bytes differ."
      }

      Write-Host "PASS: Ubuntu received the exact test bytes."
    }
    finally {
      $process.Dispose()
    }
  displayName: 'Test direct input through SSH'