trigger: none
pr: none

pool:
  name: DigitalClockPool
  demands:
    - Agent.Name -equals digitalclock-windows

steps:
- checkout: self
- powershell: |
    $sourcePath = $env:BUILD_SOURCESDIRECTORY
    Write-Host "Source folder: $sourcePath"

    Get-ChildItem -Path $sourcePath

    $requiredFiles = @(
      "Dockerfile",
      "index.html",
      "style.css",
      "script.js",
      "k8s/deployment.yaml",
      "k8s/service.yaml"
    )

    foreach ($file in $requiredFiles) {
      if (-not (Test-Path (Join-Path $sourcePath $file) -PathType Leaf)) {
        throw "Required file missing: $file"
      }
    }

    Write-Host "All required project files are present."
  displayName: 'Verify checked-out project files'

- powershell: |
    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"

    if (-not (Test-Path $keyPath)) {
      throw "SSH key not found for the Windows agent account."
    }

    ssh -i "$keyPath" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 "whoami"

    if ($LASTEXITCODE -ne 0) {
      throw "SSH connection to Ubuntu failed."
    }
  displayName: 'Check SSH connection to Ubuntu'

- powershell: |
    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"

    ssh -i "$keyPath" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 "docker info --format '{{.ServerVersion}}'"

    if ($LASTEXITCODE -ne 0) {
      throw "Docker access check failed."
    }
  displayName: 'Check Docker access in Ubuntu'

- powershell: |
    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"

    ssh -i "$keyPath" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 "minikube kubectl -- wait --for=condition=Ready node/minikube --timeout=60s"

    if ($LASTEXITCODE -ne 0) {
      throw "Kubernetes readiness check failed."
    }
  displayName: 'Check Kubernetes readiness in Ubuntu'
- powershell: |
    $ErrorActionPreference = "Stop"

    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"
    $archive = Join-Path $env:AGENT_TEMPDIRECTORY "digitalclock-source.tar.gz"
    $remoteTarget = "hazrul@127.0.0.1"
    $remoteDir = "/home/hazrul/pipeline-builds/mydigitalclock/$env:BUILD_BUILDID"

    $connectionOptions = @(
      "-i", $keyPath,
      "-o", "BatchMode=yes",
      "-o", "IdentitiesOnly=yes",
      "-o", "StrictHostKeyChecking=yes",
      "-o", "ConnectTimeout=15"
    )

    tar -czf "$archive" -C "$env:BUILD_SOURCESDIRECTORY" Dockerfile index.html style.css script.js k8s
    if ($LASTEXITCODE -ne 0) {
      throw "Failed to package source files."
    }

    ssh @connectionOptions -p 2222 $remoteTarget "mkdir -p '$remoteDir'"
    if ($LASTEXITCODE -ne 0) {
      throw "Failed to create Ubuntu build folder."
    }

    scp @connectionOptions -P 2222 "$archive" "${remoteTarget}:$remoteDir/source.tar.gz"
    if ($LASTEXITCODE -ne 0) {
      throw "Source transfer failed."
    }

    ssh @connectionOptions -p 2222 $remoteTarget "tar -xzf '$remoteDir/source.tar.gz' -C '$remoteDir' && ls -la '$remoteDir'"
    if ($LASTEXITCODE -ne 0) {
      throw "Failed to extract source files."
    }
  displayName: 'Transfer source files to Ubuntu'
- powershell: |
    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"
    $remoteDir = "/home/hazrul/pipeline-builds/mydigitalclock/$env:BUILD_BUILDID"
    $imageTag = "hazrulfitri/mydigitalclock:$env:BUILD_BUILDID"

    ssh -i "$keyPath" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 "docker build -t '$imageTag' '$remoteDir'"

    if ($LASTEXITCODE -ne 0) {
      throw "Docker image build failed."
    }

    Write-Host "Built image: $imageTag"
  displayName: 'Build Docker image in Ubuntu'
- powershell: |
    $keyPath = Join-Path $env:USERPROFILE ".ssh\digitalclock_pipeline"
    $imageTag = "hazrulfitri/mydigitalclock:$env:BUILD_BUILDID"

    if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
      throw "Docker Hub token is missing."
    }
     $token = $env:DOCKERHUB_TOKEN.Trim()
       $sha = [System.Security.Cryptography.SHA256]::Create()
    try {
        $fingerprint = [BitConverter]::ToString(
            $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($token))
        ).Replace("-", "")
        Write-Host "Token fingerprint: $fingerprint"
    }
    finally {
        $sha.Dispose()
    }

    if ($token.StartsWith('$(')) {
      throw "Azure DevOps did not resolve the secret variable."
    }

    $remoteCommand = 'set -eu; auth_dir=$(mktemp -d); trap ''rm -f "$auth_dir/config.json"; rmdir "$auth_dir"'' EXIT; docker --config "$auth_dir" login --username hazrulfitri --password-stdin; docker --config "$auth_dir" push ' + $imageTag

       Write-Host "SSH input encoding: $($OutputEncoding.WebName)"
    Write-Host "Encoding prefix bytes: $($OutputEncoding.GetPreamble().Length)"

    $OutputEncoding = [System.Text.UTF8Encoding]::new($false)

    $token | ssh -i "$keyPath" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 hazrul@127.0.0.1 $remoteCommand
    if ($LASTEXITCODE -ne 0) {
      throw "Docker Hub login or image push failed."
    }

    Write-Host "Pushed image: $imageTag"
  displayName: 'Push Docker image to private Docker Hub'
  env:
    DOCKERHUB_TOKEN: $(DOCKERHUB_TOKEN_TEST)